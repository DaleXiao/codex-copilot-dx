name: CI

on:
  push:
    branches: [main, "codex/windows-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CCDX_M365: "0"

jobs:
  runtime-packages:
    uses: ./.github/workflows/runtime-packages.yml
    with:
      ref: ${{ github.sha }}
  npm12-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Provision exact npm 12 in an isolated directory
        run: npm install --prefix "${{ runner.temp }}/ccdx-npm12" --ignore-scripts --no-audit --no-fund npm@12.0.1
      - name: Verify clean locked dependencies under strict npm 12
        run: node "${{ runner.temp }}/ccdx-npm12/node_modules/npm/bin/npm-cli.js" ci --ignore-scripts
      - name: Verify actual strict registry and cross-origin CDN installs and updates
        run: node scripts/npm12-registry-replay.mjs --npm "${{ runner.temp }}/ccdx-npm12/node_modules/npm/bin/npm-cli.js"
      - name: Verify actual package installation, upgrade and native sharp under strict npm 12
        run: node "${{ runner.temp }}/ccdx-npm12/node_modules/npm/bin/npm-cli.js" run test:package
  bootstrap:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: npm
      - id: deps
        run: npm ci
      - name: Verify configured proxy and private CA for Release downloads
        shell: bash
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: npm run test:release-network
      - name: Verify no-Git installation, missing Node bootstrap, native modules and corrupt-download retention
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: node scripts/bootstrap-replay.mjs
      - name: Verify real service version handoff, old conversations and rollback
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: node scripts/service-update-replay.mjs
      - name: Verify staged nightly npm installation, native modules and rollback
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: npm run test:nightly-package
  windows-prediction:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.15.0", "24.x"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - id: deps
        run: npm ci
      - name: Verify all unit contracts on Windows
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: npm test -- --test-concurrency=2
      - name: Provision test-only Playwright for native Windows typography
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' && matrix.node == '24.x' }}
        run: npm install --prefix "${{ runner.temp }}/ccdx-browser" playwright@1.62.1
      - name: Verify native Edge Chinese fonts, flow alignment and monochrome themes
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' && matrix.node == '24.x' }}
        run: node scripts/dashboard-browser-replay.mjs --playwright "${{ runner.temp }}/ccdx-browser/node_modules/playwright/index.js" --engines chromium --channel msedge --palettes green,mono
      - name: Verify native Edge live activity and reconnect snapshots
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' && matrix.node == '24.x' }}
        run: node scripts/activity-browser-replay.mjs --playwright "${{ runner.temp }}/ccdx-browser/node_modules/playwright/index.js" --engines chromium --channel msedge
      - name: Verify optional masking controls and preference revisions in native Edge
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' && matrix.node == '24.x' }}
        run: node scripts/privacy-browser-replay.mjs --playwright "${{ runner.temp }}/ccdx-browser/node_modules/playwright/index.js" --engines chromium --channel msedge
      - if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: npm run test:package
  prediction-browsers:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: npm
      - id: deps
        run: npm ci
      - name: Provision test-only Chromium
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: |
          npm install --prefix "${{ runner.temp }}/ccdx-browser" playwright@1.62.1 @xterm/headless@6.0.0
          node "${{ runner.temp }}/ccdx-browser/node_modules/playwright/cli.js" install chromium
      - name: Verify repeated recovery in the same browser process and preserve company fallback
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: node scripts/prediction-browser-replay.mjs --playwright "${{ runner.temp }}/ccdx-browser/node_modules/playwright/index.js"
      - name: Verify terminal table, animation, cursor updates and resize in xterm
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: node scripts/terminal-console-replay.mjs --xterm "${{ runner.temp }}/ccdx-browser/node_modules/@xterm/headless/lib-headless/xterm-headless.js"
      - name: Verify revised PAC and default credential denial handling
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: node --test test/prediction-pac.test.mjs test/copilot-auth-recovery.test.mjs
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.15.0", "24.x"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - id: deps
        run: npm ci
      - if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: npm run verify
      - name: Verify held-stream load, management responsiveness and cancellation
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: node scripts/source-load-replay.mjs
      - if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: npm run test:package
      - if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: node scripts/config-startup-replay.mjs
  codex-client:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: npm
      - id: deps
        run: npm ci
      - name: Provision pinned official Codex on the CI runner
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: npm install --prefix "$RUNNER_TEMP/ccdx-codex" @openai/codex@0.166.0
      - name: Verify native Codex privacy tool execution and continuation
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: |
          status=0
          node scripts/privacy-client-replay.mjs --client codex --binary "$RUNNER_TEMP/ccdx-codex/node_modules/.bin/codex" --privacy on || status=1
          node scripts/privacy-client-replay.mjs --client codex --binary "$RUNNER_TEMP/ccdx-codex/node_modules/.bin/codex" --privacy off || status=1
          exit "$status"
      - name: Verify prediction display and retained native ChatGPT sign-in
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: node scripts/prediction-client-replay.mjs --binary "$RUNNER_TEMP/ccdx-codex/node_modules/.bin/codex"
      - name: Verify real Codex configuration, catalog and synthetic Responses
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: node scripts/codex-message-id-replay.mjs --codex "$RUNNER_TEMP/ccdx-codex/node_modules/.bin/codex"
      - name: Verify native recorded compaction and local plaintext recovery without live provider calls
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: node scripts/codex-history-recovery-replay.mjs --codex "$RUNNER_TEMP/ccdx-codex/node_modules/.bin/codex"
      - name: Verify native reasoning declaration handling with an isolated synthetic provider
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: node scripts/codex-reasoning-header-replay.mjs --codex "$RUNNER_TEMP/ccdx-codex/node_modules/.bin/codex"
      - name: Verify native Codex image generation, edits and App protocol without cloud calls
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: node scripts/codex-image-replay.mjs --codex "$RUNNER_TEMP/ccdx-codex/node_modules/.bin/codex" --edit
      - name: Provision official Claude Code for isolated gateway replay
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: npm install --prefix "$RUNNER_TEMP/ccdx-claude" @anthropic-ai/claude-code@2.1.316
      - name: Verify native Claude Code privacy tool execution and continuation
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: |
          status=0
          node scripts/privacy-client-replay.mjs --client claude --binary "$RUNNER_TEMP/ccdx-claude/node_modules/.bin/claude" --privacy on || status=1
          node scripts/privacy-client-replay.mjs --client claude --binary "$RUNNER_TEMP/ccdx-claude/node_modules/.bin/claude" --privacy off || status=1
          exit "$status"
      - name: Verify native Claude Code effort fields through the candidate Messages gateway
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: node scripts/claude-effort-replay.mjs --claude "$RUNNER_TEMP/ccdx-claude/node_modules/.bin/claude"
      - name: Verify native custom model context budgets, reasoning and output limits
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: node scripts/claude-capabilities-replay.mjs --claude "$RUNNER_TEMP/ccdx-claude/node_modules/.bin/claude"
      - name: Verify native custom model catalogs and independent client credentials on one listener
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: node scripts/api-client-replay.mjs --codex "$RUNNER_TEMP/ccdx-codex/node_modules/.bin/codex" --claude "$RUNNER_TEMP/ccdx-claude/node_modules/.bin/claude"
      - name: Verify native Codex source-qualified deployment routes
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: node scripts/api-client-replay.mjs --codex "$RUNNER_TEMP/ccdx-codex/node_modules/.bin/codex" --bindings models
      - name: Verify native ChatGPT sign-in survives model binding changes
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: node scripts/api-client-replay.mjs --codex "$RUNNER_TEMP/ccdx-codex/node_modules/.bin/codex" --bindings models --signed-in chatgpt
      - name: Verify native OpenAI mode and complete first catalog across cold and warm starts
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: node scripts/codex-native-provider-replay.mjs --codex "$RUNNER_TEMP/ccdx-codex/node_modules/.bin/codex"
      - name: Provision verified Codex compatibility baseline
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: npm install --prefix "$RUNNER_TEMP/ccdx-codex-baseline" @openai/codex@0.164.0
      - name: Verify baseline sign-in and first catalog across cold and warm starts
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: node scripts/codex-native-provider-replay.mjs --codex "$RUNNER_TEMP/ccdx-codex-baseline/node_modules/.bin/codex"
  privacy-native-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.x
          cache: npm
      - id: deps
        run: npm ci
      - name: Provision isolated native client binaries
        shell: pwsh
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: npm install --prefix "$env:RUNNER_TEMP/ccdx-native-clients" @openai/codex@0.166.0 @anthropic-ai/claude-code@2.1.316
      - name: Verify native Windows privacy tool rounds
        shell: pwsh
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: |
          $codex = (Get-ChildItem "$env:RUNNER_TEMP/ccdx-native-clients/node_modules" -Recurse -Filter codex.exe | Select-Object -First 1).FullName
          $claude = (Get-ChildItem "$env:RUNNER_TEMP/ccdx-native-clients/node_modules" -Recurse -Filter claude.exe | Select-Object -First 1).FullName
          if (!$codex -or !$claude) { throw "Native client executables were not installed" }
          node scripts/prediction-client-replay.mjs --binary $codex
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/privacy-client-replay.mjs --client codex --binary $codex --privacy on
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/privacy-client-replay.mjs --client codex --binary $codex --privacy off
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/privacy-client-replay.mjs --client claude --binary $claude --privacy on
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/privacy-client-replay.mjs --client claude --binary $claude --privacy off
          exit $LASTEXITCODE
  dashboard-browsers:
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        palette: [green, klein, pink, mono]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: npm
      - id: deps
        run: npm ci
      - name: Provision matching test-only Playwright package
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: npm install --prefix "$RUNNER_TEMP/ccdx-browser" playwright@1.62.1
      - if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: node "$RUNNER_TEMP/ccdx-browser/node_modules/playwright/cli.js" install ${{ matrix.engine }}
      - name: Verify bilingual themes, small screens, timer and user-state preservation
        if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' }}
        run: node scripts/dashboard-browser-replay.mjs --palettes ${{ matrix.palette }} --engines ${{ matrix.engine }} --playwright "$RUNNER_TEMP/ccdx-browser/node_modules/playwright/index.js" --output "$RUNNER_TEMP/ccdx-dashboard-screenshots"
      - if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' && matrix.palette == 'green' }}
        name: Verify API creation, many-to-many access, disabling and recovery
        run: node scripts/connections-browser-replay.mjs --engines ${{ matrix.engine }} --playwright "$RUNNER_TEMP/ccdx-browser/node_modules/playwright/index.js" --output "$RUNNER_TEMP/ccdx-connection-screenshots"
      - if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' && matrix.palette == 'green' }}
        name: Verify native image switch, single-choice models and Codex configuration
        run: node scripts/image-controls-browser-replay.mjs --engines ${{ matrix.engine }} --playwright "$RUNNER_TEMP/ccdx-browser/node_modules/playwright/index.js"
      - if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' && matrix.palette == 'green' }}
        name: Verify optional masking interactions without downloading a model
        run: node scripts/privacy-browser-replay.mjs --engines ${{ matrix.engine }} --playwright "$RUNNER_TEMP/ccdx-browser/node_modules/playwright/index.js"
      - if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' && matrix.palette == 'green' }}
        name: Verify disclosure motion, keyboard operation and reduced motion
        run: node scripts/disclosure-browser-replay.mjs --engines ${{ matrix.engine }} --playwright "$RUNNER_TEMP/ccdx-browser/node_modules/playwright/index.js"
      - if: ${{ !cancelled() && always() && steps.deps.outcome == 'success' && matrix.palette == 'green' }}
        name: Verify live activity, three-app concurrency and reconnect snapshots
        run: node scripts/activity-browser-replay.mjs --engines ${{ matrix.engine }} --playwright "$RUNNER_TEMP/ccdx-browser/node_modules/playwright/index.js"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dashboard-${{ matrix.engine }}-${{ matrix.palette }}
          path: ${{ runner.temp }}/ccdx-*-screenshots/
          if-no-files-found: ignore
          retention-days: 7
