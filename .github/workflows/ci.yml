name: CI

on:
  push:
    branches: [main, "codex/windows-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-prediction:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.15.0", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Verify Windows updater process, certificates, worker, profile, ACL, launch and recovery
        run: node --test test/package-update.test.mjs test/package-update-windows.test.mjs test/bounded-file.test.mjs test/auth.test.mjs test/auth-profile.test.mjs test/doctor.test.mjs test/adapter.test.mjs test/response-failures.test.mjs test/native-prediction-windows.test.mjs test/launcher.test.mjs test/windows-prediction-network.test.mjs test/local-compaction-recovery.test.mjs test/dashboard-refresh.test.mjs test/dashboard-analytics-ui.test.mjs test/dashboard-language.test.mjs test/dashboard-theme.test.mjs test/dashboard-status-ui.test.mjs test/upstream-headers.test.mjs test/cli-models.test.mjs test/module-boundaries.test.mjs test/http-transport.test.mjs
      - name: Verify startup presentation and bounded prediction recovery on Windows
        run: node --test test/startup-ui.test.mjs test/native-prediction-route.test.mjs test/native-prediction-recovery.test.mjs test/native-prediction-protocol.test.mjs test/prediction-fix.test.mjs
      - name: Verify streaming delivery and Chat semantic validation on Windows
        run: node --test test/stream-delivery.test.mjs test/responses-bridge.test.mjs test/responses-chat-http.test.mjs
      - run: npm run test:package
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.15.0", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:smoke
      - run: npm run test:package
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.15.0", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:package
      - run: node scripts/config-startup-replay.mjs
  codex-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Provision latest official Codex on the CI runner
        run: npm install --prefix "$RUNNER_TEMP/ccdx-codex" @openai/codex@latest
      - name: Verify real Codex configuration, catalog and synthetic Responses
        run: node scripts/codex-message-id-replay.mjs --codex "$RUNNER_TEMP/ccdx-codex/node_modules/.bin/codex"
      - name: Verify native recorded compaction and local plaintext recovery without live provider calls
        run: node scripts/codex-history-recovery-replay.mjs --codex "$RUNNER_TEMP/ccdx-codex/node_modules/.bin/codex"
      - name: Verify native reasoning declaration handling with an isolated synthetic provider
        run: node scripts/codex-reasoning-header-replay.mjs --codex "$RUNNER_TEMP/ccdx-codex/node_modules/.bin/codex"
  dashboard-browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Provision test-only browser engines
        run: |
          npm install --prefix "$RUNNER_TEMP/ccdx-browser" playwright@1.62.1
          "$RUNNER_TEMP/ccdx-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Verify bilingual themes, small screens, timer and user-state preservation
        run: node scripts/dashboard-browser-replay.mjs --playwright "$RUNNER_TEMP/ccdx-browser/node_modules/playwright/index.js" --output "$RUNNER_TEMP/ccdx-dashboard-screenshots"
