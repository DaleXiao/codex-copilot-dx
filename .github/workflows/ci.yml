name: CI

on:
  push:
    branches: [main, "codex/windows-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-prediction:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.15.0", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Verify native Windows certificates, worker, profile, ACL, launch and local-history recovery
        run: node --test test/native-prediction-windows.test.mjs test/windows-prediction-network.test.mjs test/local-compaction-recovery.test.mjs
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.15.0", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: node scripts/config-startup-replay.mjs
  codex-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Provision latest official Codex on the CI runner
        run: npm install --prefix "$RUNNER_TEMP/ccdx-codex" @openai/codex@latest
      - name: Verify real Codex configuration, catalog and synthetic Responses
        run: node scripts/codex-message-id-replay.mjs --codex "$RUNNER_TEMP/ccdx-codex/node_modules/.bin/codex"
      - name: Verify native recorded compaction and local plaintext recovery without live provider calls
        run: node scripts/codex-history-recovery-replay.mjs --codex "$RUNNER_TEMP/ccdx-codex/node_modules/.bin/codex"
