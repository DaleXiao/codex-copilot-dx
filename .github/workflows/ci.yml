name: CI

on:
  push:
    branches: [main, "codex/windows-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CCDX_M365: "0"

jobs:
  npm12-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Provision exact npm 12 in an isolated directory
        run: npm install --prefix "${{ runner.temp }}/ccdx-npm12" --ignore-scripts --no-audit --no-fund npm@12.0.1
      - name: Verify clean locked dependencies under strict npm 12
        run: node "${{ runner.temp }}/ccdx-npm12/node_modules/npm/bin/npm-cli.js" ci --ignore-scripts
      - name: Verify actual strict registry and cross-origin CDN installs and updates
        run: node scripts/npm12-registry-replay.mjs --npm "${{ runner.temp }}/ccdx-npm12/node_modules/npm/bin/npm-cli.js"
      - name: Verify actual package installation, upgrade and native sharp under strict npm 12
        run: node "${{ runner.temp }}/ccdx-npm12/node_modules/npm/bin/npm-cli.js" run test:package
  bootstrap:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Verify configured proxy and private CA for Release downloads
        shell: bash
        run: npm run test:release-network
      - name: Verify no-Git installation, missing Node bootstrap, native modules and corrupt-download retention
        run: node scripts/bootstrap-replay.mjs
  windows-prediction:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.15.0", "24.x"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Verify Windows updater process, certificates, worker, profile, ACL, launch and recovery
        run: node --test --test-concurrency=2 test/package-update.test.mjs test/package-update-windows.test.mjs test/release-install.test.mjs test/bounded-file.test.mjs test/auth.test.mjs test/auth-profile.test.mjs test/doctor.test.mjs test/adapter.test.mjs test/response-failures.test.mjs test/native-prediction-windows.test.mjs test/launcher.test.mjs test/windows-prediction-network.test.mjs test/local-compaction-recovery.test.mjs test/dashboard-refresh.test.mjs test/dashboard-updates.test.mjs test/dashboard-analytics-ui.test.mjs test/dashboard-language.test.mjs test/dashboard-time.test.mjs test/dashboard-theme.test.mjs test/dashboard-status-ui.test.mjs test/upstream-headers.test.mjs test/cli-models.test.mjs test/module-boundaries.test.mjs test/http-transport.test.mjs
      - name: Verify startup presentation and bounded prediction recovery on Windows
        run: node --test test/startup-ui.test.mjs test/quiet-startup.test.mjs test/native-prediction-route.test.mjs test/native-prediction-recovery.test.mjs test/native-prediction-protocol.test.mjs test/prediction-fix.test.mjs test/network-route.test.mjs test/network-environment.test.mjs
      - name: Verify command ownership, credential discovery and bounded doctor repairs
        run: node --test test/windows-command.test.mjs test/auth-sources.test.mjs test/doctor-repair.test.mjs test/cli-options.test.mjs test/codex-config-doctor.test.mjs test/lock.test.mjs
      - name: Verify streaming delivery and Chat semantic validation on Windows
        run: node --test test/stream-delivery.test.mjs test/responses-bridge.test.mjs test/responses-chat-http.test.mjs test/responses-native-http.test.mjs test/stream-performance.test.mjs test/cli-status.test.mjs
      - name: Verify isolated provider, broker, gateway, ownership and system network contracts
        run: node --test test/claude-models.test.mjs test/m365-auth.test.mjs test/m365-accounts.test.mjs test/m365-account-selection.test.mjs test/m365-provider.test.mjs test/m365-catalog-diagnostic.test.mjs test/m365-network.test.mjs test/provider-runtime.test.mjs test/provider-registry.test.mjs test/client-integration-state.test.mjs test/claude-gateway.test.mjs test/claude-client-config.test.mjs test/cli-m365.test.mjs test/shared-listener.test.mjs test/service-control.test.mjs test/terminal-console.test.mjs test/browser-launch.test.mjs test/listener-lifecycle.test.mjs test/dashboard-activity.test.mjs
      - name: Verify manual API, native credentials and client authorization boundaries
        run: node --test test/connections.test.mjs test/connections-http.test.mjs test/api-network.test.mjs
      - run: npm run test:package
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.15.0", "24.x"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:smoke
      - run: npm run test:package
  prediction-browsers:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Provision test-only Chromium
        run: |
          npm install --prefix "${{ runner.temp }}/ccdx-browser" playwright@1.62.1 @xterm/headless@6.0.0
          node "${{ runner.temp }}/ccdx-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify repeated recovery in the same browser process and preserve company fallback
        run: node scripts/prediction-browser-replay.mjs --playwright "${{ runner.temp }}/ccdx-browser/node_modules/playwright/index.js"
      - name: Verify terminal table, animation, cursor updates and resize in xterm
        run: node scripts/terminal-console-replay.mjs --xterm "${{ runner.temp }}/ccdx-browser/node_modules/@xterm/headless/lib-headless/xterm-headless.js"
      - name: Verify revised PAC and default credential denial handling
        run: node --test test/prediction-pac.test.mjs test/copilot-auth-recovery.test.mjs
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.15.0", "24.x"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Verify held-stream load, management responsiveness and cancellation
        run: node scripts/source-load-replay.mjs
      - run: npm run test:package
      - run: node scripts/config-startup-replay.mjs
  codex-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Provision latest official Codex on the CI runner
        run: npm install --prefix "$RUNNER_TEMP/ccdx-codex" @openai/codex@latest
      - name: Verify real Codex configuration, catalog and synthetic Responses
        run: node scripts/codex-message-id-replay.mjs --codex "$RUNNER_TEMP/ccdx-codex/node_modules/.bin/codex"
      - name: Verify native recorded compaction and local plaintext recovery without live provider calls
        run: node scripts/codex-history-recovery-replay.mjs --codex "$RUNNER_TEMP/ccdx-codex/node_modules/.bin/codex"
      - name: Verify native reasoning declaration handling with an isolated synthetic provider
        run: node scripts/codex-reasoning-header-replay.mjs --codex "$RUNNER_TEMP/ccdx-codex/node_modules/.bin/codex"
      - name: Verify native Codex image discovery, delivery and edit handles without live generation
        run: node scripts/codex-image-replay.mjs --codex "$RUNNER_TEMP/ccdx-codex/node_modules/.bin/codex" --edit
      - name: Provision official Claude Code for isolated gateway replay
        run: npm install --prefix "$RUNNER_TEMP/ccdx-claude" @anthropic-ai/claude-code
      - name: Verify native Claude Code effort fields through the candidate Messages gateway
        run: node scripts/claude-effort-replay.mjs --claude "$RUNNER_TEMP/ccdx-claude/node_modules/.bin/claude"
      - name: Verify native custom model catalogs and independent client credentials on one listener
        run: node scripts/api-client-replay.mjs --codex "$RUNNER_TEMP/ccdx-codex/node_modules/.bin/codex" --claude "$RUNNER_TEMP/ccdx-claude/node_modules/.bin/claude"
  dashboard-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Provision test-only browser engines
        run: |
          npm install --prefix "$RUNNER_TEMP/ccdx-browser" playwright@1.62.1
          "$RUNNER_TEMP/ccdx-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Verify bilingual themes, small screens, timer and user-state preservation
        run: node scripts/dashboard-browser-replay.mjs --playwright "$RUNNER_TEMP/ccdx-browser/node_modules/playwright/index.js" --output "$RUNNER_TEMP/ccdx-dashboard-screenshots"
      - name: Verify API creation, many-to-many access, disabling and recovery
        run: node scripts/connections-browser-replay.mjs --playwright "$RUNNER_TEMP/ccdx-browser/node_modules/playwright/index.js" --output "$RUNNER_TEMP/ccdx-connection-screenshots"
