name: Publish npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  runtime-packages:
    uses: ./.github/workflows/runtime-packages.yml
    with:
      ref: v${{ inputs.version }}
  publish:
    needs: runtime-packages
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
          cache: npm
      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
      - run: npm ci
      - run: npm run verify
      - run: npm run release:pack -- "$RUNNER_TEMP/ccdx-release"
      - run: npm publish "$RUNNER_TEMP/ccdx-release/codex-copilot-dx-${{ inputs.version }}.tgz" --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
