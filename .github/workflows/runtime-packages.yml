name: Complete platform packages
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Isolated backend comparison ref
        required: true
        type: string
permissions:
  contents: read
jobs:
  runtime:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27.3"
          cache-dependency-path: native/privacy-guard/go.sum
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ccdx-privacy-model
          key: privacy-model-7216b6a3b897ef903d4b1ba367ae6fb95b0fa5e4
      - name: Verify isolated weights and current component
        run: |
          node scripts/privacy-component.mjs "$RUNNER_TEMP/privacy-component" darwin-x64
          node scripts/privacy-native-replay.mjs "$RUNNER_TEMP/privacy-component" "$RUNNER_TEMP/ccdx-privacy-model"
      - name: Compare CoreML CPU and native Go on identical inputs
        working-directory: native/privacy-guard
        env:
          CCDX_BACKEND_MODEL_DIR: ${{ runner.temp }}/ccdx-privacy-model
        run: go test -mod=vendor -run TestBackendCostComparison -count=1 -v -timeout=8m ./guard
