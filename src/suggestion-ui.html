<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Next message</title>
<style>
:root{color-scheme:light dark;font-family:var(--font-sans,system-ui,sans-serif);font-size:14px;color:var(--color-text-primary,CanvasText);background:transparent}body{margin:0;padding:20px}h1{font-size:16px;font-weight:600;margin:0 0 16px}#suggestion{font-size:15px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;min-height:3.3em}footer{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{font:inherit;border:1px solid var(--color-border-primary,GrayText);border-radius:8px;padding:9px 14px;background:transparent;color:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:2px solid Highlight;outline-offset:3px}#status,#note,#model{font-size:12px;line-height:1.6;color:var(--color-text-secondary,GrayText)}#status{min-height:1.6em}#model{margin-top:12px}
</style>
<h1 id="title">Next message</h1><div id="suggestion"></div><div id="model"></div>
<footer><button id="adopt" disabled>Add to draft</button><button id="generate" disabled>Generate</button></footer>
<p id="status" role="status" aria-live="polite"></p><p id="note">Adds ordinary text to your draft. You decide whether to send.</p>
<script>
const pending=new Map();let next=0,current=null,ready=false,busy=false,supportsDraft=false,applied=null;
const $=id=>document.getElementById(id);
let zh=/^zh/i.test(navigator.language);
const words=()=>zh?{title:"下一句",adopt:"加入草稿",generate:"生成建议",note:"加入普通草稿，由你决定是否发送。",empty:"暂无建议。",generating:"正在生成…",added:"已加入草稿，尚未发送。",unsupported:"当前客户端不支持加入草稿，请更新客户端。",connecting:"正在连接…",failed:"请求失败，请手动重试。",model:"模型"}:{title:"Next message",adopt:"Add to draft",generate:"Generate",note:"Adds ordinary text to your draft. You decide whether to send.",empty:"No suggestion yet.",generating:"Generating…",added:"Added to draft. Not sent.",unsupported:"This client does not support draft insertion. Update the client.",connecting:"Connecting…",failed:"Request failed. Retry manually.",model:"Model"};
function labels(){const w=words();$("title").textContent=w.title;$("adopt").textContent=w.adopt;$("generate").textContent=w.generate;$("note").textContent=w.note;document.documentElement.lang=zh?"zh-CN":"en"}
function buttons(){$("generate").disabled=!ready||busy;$("adopt").disabled=!ready||busy||!supportsDraft||!current?.candidate_id||applied===current.candidate_id}
function request(method,params){return new Promise((resolve,reject)=>{const id=++next,timer=setTimeout(()=>{pending.delete(id);reject(new Error(words().failed))},35000);pending.set(id,{resolve,reject,timer});parent.postMessage({jsonrpc:"2.0",id,method,params},"*")})}
function data(result){if(result?.isError)throw new Error(result.content?.find(p=>p.type==="text")?.text||words().failed);const value=result?.structuredContent;if(!value||typeof value!=="object")throw new Error(words().failed);return value}
function render(value){current=value;$("suggestion").textContent=typeof value.suggestion==="string"?value.suggestion:words().empty;$("model").textContent=value.model?`${words().model}: ${value.model}`:"";buttons()}
addEventListener("message",event=>{if(event.source!==parent)return;const message=event.data;if(message?.jsonrpc!=="2.0")return;const p=pending.get(message.id);if(p){pending.delete(message.id);clearTimeout(p.timer);message.error?p.reject(new Error(message.error.message||words().failed)):p.resolve(message.result);return}if(message.method==="ui/notifications/tool-result"&&!busy){try{render(data(message.params));$("status").textContent=supportsDraft?"":words().unsupported}catch(error){$("status").textContent=error.message}}});
$("generate").onclick=async()=>{if(busy||!ready)return;busy=true;buttons();$("status").textContent=words().generating;try{render(data(await request("tools/call",{name:"suggest_next_message",arguments:{}})));$("status").textContent=supportsDraft?"":words().unsupported}catch(error){$("status").textContent=error.message}finally{busy=false;buttons()}};
$("adopt").onclick=async()=>{if(busy||!current?.candidate_id||!supportsDraft)return;busy=true;buttons();const id=current.candidate_id;try{const checked=data(await request("tools/call",{name:"prepare_suggestion_draft",arguments:{candidate_id:id}}));if(checked.candidate_id!==id||checked.suggestion!==current.suggestion)throw new Error(words().failed);await request("ui/message",{role:"user",content:[{type:"text",text:checked.suggestion}],_meta:{"openai/message":{target:"active",send:false}}});applied=id;$("status").textContent=words().added}catch(error){$("status").textContent=error.message}finally{busy=false;buttons()}};
labels();$("status").textContent=words().connecting;
request("ui/initialize",{appInfo:{name:"CCDX Next message",version:"1"},appCapabilities:{},protocolVersion:"2026-01-26"}).then(result=>{if(result.hostContext?.locale)zh=/^zh/i.test(result.hostContext.locale);labels();supportsDraft=Boolean(result.hostCapabilities?.experimental?.["openai/message"]?.draft);parent.postMessage({jsonrpc:"2.0",method:"ui/notifications/initialized",params:{}},"*");ready=true;$("status").textContent=supportsDraft?"":words().unsupported;if(!current)$("suggestion").textContent=words().empty;buttons()}).catch(error=>{$("status").textContent=error.message});
addEventListener("pagehide",()=>{for(const p of pending.values()){clearTimeout(p.timer);p.reject(new Error("Panel closed"))}pending.clear()});
</script></html>
